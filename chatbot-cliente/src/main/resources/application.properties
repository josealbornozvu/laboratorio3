spring.application.name=chatbot-cliente
server.port=8090

# --- Gemini (clave gratuita de Google AI Studio, leida de la variable GEMINI_API_KEY) ---
# Importante: NO definir project-id ni location; eso activaria Vertex AI (de pago).
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash

# --- Cliente MCP -> servidor del supermercado (Streamable HTTP) ---
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.supermercado.url=http://localhost:8089
spring.ai.mcp.client.streamable-http.connections.supermercado.endpoint=/mcp

logging.level.root=INFO
logging.level.org.springframework.ai=DEBUG
